<svg
  xmlns="http://www.w3.org/2000/svg"
  width="600"
  height="168"
  viewBox="0 0 25 7"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">The four Frobenius generators</title>
  <desc id="description">From left to right: unit, split, merge, and counit spiders.</desc>
  <style>
    svg { color-scheme: light dark; }
    .spider { color: #111; }
    .spider path { fill: none; stroke: currentColor; stroke-width: 0.05; }
    .spider text { fill: currentColor; font-family: sans-serif; }
    @media (prefers-color-scheme: dark) {
      .spider { color: #f5f5f5; }
    }
  </style>

  <g class="spider">
    <!-- Unit: [. x] -->
    <g transform="translate(1 2.5)">
      <path d="M 2.6 0 L 3 0"/>
      <path d="M 2.6 -0.2 L 2.6 0.2"/>
    </g>
    <text x="2.5" y="5.5" text-anchor="middle" font-size="0.65">unit (η)</text>

    <!-- Split: [x . x x] -->
    <g transform="translate(7.5 1.5)">
      <path d="M 3 0 L 2.6 0"/>
      <path d="M 3 2 L 2.6 2"/>
      <path d="M 0.4 1 L 0 1"/>
      <path d="M 2.6 0 C 1.5 0 1.5 1 0.4 1"/>
      <path d="M 2.6 2 C 1.5 2 1.5 1 0.4 1"/>
    </g>
    <text x="9" y="5.5" text-anchor="middle" font-size="0.65">split (δ)</text>

    <!-- Merge: [x x . x] -->
    <g transform="translate(14 1.5)">
      <path d="M 0 0 L 0.4 0"/>
      <path d="M 0 2 L 0.4 2"/>
      <path d="M 2.6 1 L 3 1"/>
      <path d="M 0.4 0 C 1.5 0 1.5 1 2.6 1"/>
      <path d="M 0.4 2 C 1.5 2 1.5 1 2.6 1"/>
    </g>
    <text x="15.5" y="5.5" text-anchor="middle" font-size="0.65">merge (μ)</text>

    <!-- Counit: [x .] -->
    <g transform="translate(21 2.5)">
      <path d="M 0.4 0 L 0 0"/>
      <path d="M 0.4 -0.2 L 0.4 0.2"/>
    </g>
    <text x="22.5" y="5.5" text-anchor="middle" font-size="0.65">counit (ε)</text>
  </g>
</svg>
